name: samvaad_widget
description: Samvaad chat for Flutter apps. A thin binding over the Samvaad iOS and Android SDKs.
version: 0.1.0
homepage: https://samvaads.com
repository: https://github.com/sachdesk/samvaad-flutter
issue_tracker: https://github.com/sachdesk/samvaad-flutter/issues
documentation: https://developers.samvaads.com/docs/mobile-sdks
topics:
  - chat
  - customer-support
  - live-chat

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.samvaads.flutter
        pluginClass: SamvaadWidgetPlugin
      ios:
        pluginClass: SamvaadWidgetPlugin
