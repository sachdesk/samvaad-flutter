name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

  # Builds example/ for Android so CI compiles the plugin's Kotlin against the real
  # Samvaad Android SDK. The platform folder is generated here, not committed.
  example-android:
    name: Example app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        working-directory: example
        run: flutter create . --platforms=android --org in.yobruh --project-name samvaad_widget_example

      - name: Use mavenLocal and minSdk 24
        working-directory: example/android
        run: |
          # The SDK is published to mavenLocal below (it is not on Maven Central yet).
          perl -0pi -e 's/(allprojects\s*\{\s*repositories\s*\{)/$1\n        mavenLocal()/' build.gradle*
          grep -q 'mavenLocal()' build.gradle* || { echo "::error::Could not add mavenLocal() to example/android/build.gradle"; exit 1; }
          sed -i 's/flutter\.minSdkVersion/24/' app/build.gradle*
          grep -Eq 'minSdk(Version)?[ =]+24' app/build.gradle* || { echo "::error::Could not set minSdk 24 in example/android/app/build.gradle"; exit 1; }

      - name: Check access to sachdesk/samvaad-android
        env:
          TOKEN: ${{ secrets.SDK_READ_TOKEN || github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if ! git ls-remote "https://x-access-token:${TOKEN}@github.com/sachdesk/samvaad-android.git" HEAD > /dev/null 2>&1; then
            echo "::error title=No access to sachdesk/samvaad-android::Add a repository secret SDK_READ_TOKEN (read access to sachdesk/samvaad-android and sachdesk/samvaad-ios) or make the SDK repos public."
            exit 1
          fi

      - name: Check out the Android SDK
        uses: actions/checkout@v4
        with:
          repository: sachdesk/samvaad-android
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}
          path: .sdk/samvaad-android

      - name: Publish the Android SDK to mavenLocal
        working-directory: .sdk/samvaad-android
        run: |
          chmod +x gradlew
          ./gradlew :samvaad:publishToMavenLocal --stacktrace
          ls ~/.m2/repository/com/samvaads/widget/0.1.0

      - name: Build the example APK
        working-directory: example
        run: flutter build apk --debug

  # Builds example/ for the iOS simulator so CI compiles the plugin's Swift against the
  # real Samvaad iOS SDK. The platform folder is generated here, not committed.
  example-ios:
    name: Example app (iOS)
    runs-on: macos-14
    env:
      SAMVAAD_IOS_PATH: ${{ github.workspace }}/.sdk/samvaad-ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the iOS project
        working-directory: example
        run: |
          flutter create . --platforms=ios --org in.yobruh --project-name samvaad_widget_example
          flutter pub get
          test -f ios/Podfile || { echo "::error::flutter did not generate example/ios/Podfile"; exit 1; }

      - name: Use iOS 15 and the checked-out Samvaad pod
        working-directory: example/ios
        run: |
          # The Samvaad pod has no release tag yet, so it comes from the checked-out SDK.
          perl -0pi -e 's/^#?\s*platform :ios,.*$/platform :ios, "15.0"/m' Podfile
          perl -0pi -e 's/^(target .Runner. do)$/$1\n  pod "Samvaad", :path => "$ENV{SAMVAAD_IOS_PATH}"/m' Podfile
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' Runner.xcodeproj/project.pbxproj
          grep -q 'platform :ios, "15.0"' Podfile || { echo "::error::Could not set iOS 15 in example/ios/Podfile"; exit 1; }
          grep -q 'pod "Samvaad"' Podfile || { echo "::error::Could not add the Samvaad pod to example/ios/Podfile"; exit 1; }
          cat Podfile

      - name: Check access to sachdesk/samvaad-ios
        env:
          TOKEN: ${{ secrets.SDK_READ_TOKEN || github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if ! git ls-remote "https://x-access-token:${TOKEN}@github.com/sachdesk/samvaad-ios.git" HEAD > /dev/null 2>&1; then
            echo "::error title=No access to sachdesk/samvaad-ios::Add a repository secret SDK_READ_TOKEN (read access to sachdesk/samvaad-android and sachdesk/samvaad-ios) or make the SDK repos public."
            exit 1
          fi

      - name: Check out the iOS SDK
        uses: actions/checkout@v4
        with:
          repository: sachdesk/samvaad-ios
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}
          path: .sdk/samvaad-ios

      - name: Install pods
        working-directory: example/ios
        run: pod install

      - name: Build the example for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign
